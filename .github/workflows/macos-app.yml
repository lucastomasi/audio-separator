name: macOS app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.py"
      - "**/*.py"
      - "ui.css"
      - "macos/**"
      - "requirements-macos.txt"
      - ".github/workflows/macos-app.yml"

jobs:
  dmg:
    name: Unsigned .app and .dmg
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app and disk image
        run: bash macos/build_release.sh

      - name: Show artifact size
        run: du -sh dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Separator-macos-arm64
          path: dist/Audio-Separator-arm64.dmg
          if-no-files-found: error

      - name: Publish the disk image
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-arm64
          target_commitish: ${{ github.sha }}
          name: Audio Separator para Mac
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/Audio-Separator-arm64.dmg
          body_path: macos/LEEME.txt
