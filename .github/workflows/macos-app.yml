name: macOS app

on:
  workflow_dispatch:

jobs:
  dmg:
    name: Unsigned .app and .dmg
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build app and disk image
        run: bash macos/build_release.sh

      - name: Show artifact size
        run: du -sh dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Audio-Separator-macos-arm64
          path: dist/Audio-Separator-arm64.dmg
          if-no-files-found: error

      - name: Publish the disk image
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: macos-arm64-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Audio Separator para Mac
          prerelease: true
          make_latest: false
          files: dist/Audio-Separator-arm64.dmg
          body_path: macos/LEEME.txt
