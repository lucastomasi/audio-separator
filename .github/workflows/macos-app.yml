name: macOS app

on:
  workflow_dispatch:

jobs:
  dmg:
    name: Unsigned .app and .dmg
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build app and disk image
        run: bash macos/build_release.sh

      - name: Show artifact size
        run: du -sh dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Audio-Separator-macos-arm64
          path: dist/Audio-Separator-arm64.dmg
          if-no-files-found: error

      - name: Publish the disk image
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: macos-arm64-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Audio Separator para Mac
          prerelease: true
          make_latest: false
          files: dist/Audio-Separator-arm64.dmg
          body_path: macos/LEEME.txt
