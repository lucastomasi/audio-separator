name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >
          pip install
          "numpy<2" scipy soundfile gradio scikit-learn
          yt-dlp requests urllib3
      - run: PYTHONPATH=. python -m unittest discover -s tests -q
