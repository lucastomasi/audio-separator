name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolver pins (Intel Mac files must be internally satisfiable)
        run: |
          python -m pip install -U pip
          python -m pip install --dry-run -r requirements-macos.txt
          python -m pip install --dry-run -r requirements-vc.txt
      - name: Intel x86_64 wheels exist for pinned binaries
        run: |
          python -m pip download -d /tmp/intel-wheels --no-deps \
            --python-version 312 --platform macosx_10_13_x86_64 \
            --implementation cp --abi cp312 --only-binary=:all: \
            torch==2.2.2 torchaudio==2.2.2 torchvision==0.17.2
          python -m pip download -d /tmp/intel-wheels --no-deps \
            --python-version 312 --platform macosx_10_14_x86_64 \
            --implementation cp --abi cp312 --only-binary=:all: \
            faiss-cpu==1.10.0 numba==0.60.0 llvmlite==0.43.0
          ls /tmp/intel-wheels
          python -c "import pathlib; names=sorted(p.name for p in pathlib.Path('/tmp/intel-wheels').iterdir()); assert any('torch-2.2.2' in n and 'x86_64' in n for n in names), names; assert any('torchaudio-2.2.2' in n and 'x86_64' in n for n in names), names; assert any('faiss_cpu-1.10.0' in n and 'x86_64' in n for n in names), names"
      - run: >
          pip install
          "numpy<2" scipy soundfile gradio scikit-learn
          yt-dlp requests urllib3
          pedalboard picklescan safetensors pywebview
          torch torchaudio onnxruntime
      - run: PYTHONPATH=. python -m unittest discover -s tests -q
